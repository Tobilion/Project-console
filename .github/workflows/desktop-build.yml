name: Desktop Builds

# Cross-platform installer builds for the Electron desktop shell (2026-08-24). The Windows
# NSIS build is run locally (`cd desktop && npm run dist`); this matrix produces the .dmg and
# .AppImage on hosts that can actually build them, so the mac/linux targets stop being
# real-but-unverified config. The designed brand icon ships as build/icon.png (Linux),
# build/icon.ico (Windows NSIS) and build/icon.icns (mac dmg) — generated from the source
# JPEG by the round-6 audit pass; the mac build fails loudly if the icon is ever missing.
#
# How to trigger a build WITHOUT pushing code: GitHub -> Actions -> "Desktop Builds" ->
# "Run workflow" -> Run. The installers land in the run's "Artifacts" section (bottom of the
# run summary page), downloaded per-OS (.dmg from macos, .AppImage from ubuntu).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            flags: --mac dmg
            # macos-latest is an arm64 runner; electron-builder appends the arch
            # suffix on Apple Silicon builds (Project Console-1.0.0-arm64.dmg).
            artifact: Project Console-1.0.0-arm64.dmg
          - os: ubuntu-latest
            target: linux
            flags: --linux AppImage
            artifact: Project Console-1.0.0.AppImage
    runs-on: ${{ matrix.os }}
    env:
      # No code-signing identity exists for these builds — electron-builder must not try to
      # discover one on the mac runner (it would fail the build without a cert).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # Electron 43 requires node >= 22.12 (the EBADENGINE warnings below are its
          # own build toolchain); the repo root's engines field is >=20, satisfied here.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # stage-server.mjs builds the frontend through the repo root's own vite binary
      # (`node_modules/vite/bin/vite.js`), so the ROOT dependencies must be installed
      # before staging — the first CI run failed exactly here (MODULE_NOT_FOUND).
      - name: Install repo-root dependencies (vite, build tooling)
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Install desktop build tools (electron, electron-builder)
        run: npm ci
        working-directory: desktop

      - name: Stage the server runtime (source + built frontend + prod node_modules)
        run: npm run stage
        working-directory: desktop

      - name: Build ${{ matrix.target }} installer
        run: npx electron-builder ${{ matrix.flags }} --publish never
        working-directory: desktop

      - name: Verify installer artifact exists
        # electron-builder writes into desktop/dist — the repo root has its own (server-bundle)
        # dist/ directory, so without an explicit working-directory the ls/test hit the wrong dir.
        working-directory: desktop
        run: |
          ls -la "dist/${{ matrix.artifact }}"
          test -s "dist/${{ matrix.artifact }}"
          echo "installer verified: $(stat -c%s "dist/${{ matrix.artifact }}" 2>/dev/null || stat -f%z "dist/${{ matrix.artifact }}") bytes"

      - name: Smoke-check AppImage contents (linux)
        if: matrix.target == 'linux'
        working-directory: desktop
        run: |
          chmod +x "dist/${{ matrix.artifact }}"
          ./"dist/${{ matrix.artifact }}" --appimage-extract >/dev/null
          test -d squashfs-root && test -f squashfs-root/resources/app.asar
          echo "AppImage extraction OK"

      - name: Upload ${{ matrix.target }} installer
        uses: actions/upload-artifact@v4
        with:
          name: project-console-${{ matrix.target }}-installer
          path: desktop/dist/${{ matrix.artifact }}
          if-no-files-found: error

  # Windows NSIS is built on a Windows runner AND published to GitHub Releases (--publish
  # always, the electron-updater channel main.cjs checks). mac/linux stay artifact-only until
  # code signing exists — an unsigned auto-update would fail on those platforms anyway.
  publish-windows:
    runs-on: windows-latest
    permissions:
      # electron-builder's GitHub provider creates a release + uploads assets; the default
      # token is contents:read-only on this repo, which made the publish fail with
      # "Resource not accessible by integration" (403) on the first run (2026-08-25).
      contents: write
    env:
      # electron-updater's GitHub provider reads GH_TOKEN; the Actions token can create
      # releases on this repo.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install repo-root dependencies (vite, build tooling)
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Install desktop build tools (electron, electron-builder)
        run: npm ci
        working-directory: desktop

      - name: Stage + build + publish the Windows NSIS installer
        run: npm run dist:publish
        working-directory: desktop

      - name: Verify installer artifact exists
        working-directory: desktop
        shell: powershell
        run: |
          $file = Get-Item "dist\Project Console Setup *.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $file -or $file.Length -lt 1MB) { throw "NSIS installer missing or too small" }
          Write-Host "installer verified: $($file.Name) ($($file.Length) bytes)"