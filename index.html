<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Project Console V4</title>
    <script>
      // Set the theme before first paint so light-mode users never see a dark flash.
      // Mirrors src/hooks/useTheme.ts's initialTheme(): saved preference wins,
      // else follow the OS. Runs before React mounts.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
      // Global promise-rejection guard — an uncaught rejection outside React (e.g. a
      // failed fetch in a tool panel's effect) otherwise surfaces as a console error
      // with no UI signal. Log it so the user can report it; the app stays mounted.
      window.addEventListener('unhandledrejection', function (e) {
        try { console.error('Unhandled promise rejection:', e.reason); } catch {}
      });
      window.addEventListener('error', function (e) {
        try { console.error('Window error:', e.message, e.filename + ':' + e.lineno); } catch {}
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
